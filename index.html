<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020916">

  <title>Analy — Mis XV Años</title>
  <meta name="description" content="Invitación a los XV años de Analy — 12 de septiembre de 2026.">

  <meta property="og:title" content="Analy — Mis XV Años">
  <meta property="og:description" content="Hay momentos que iluminan una vida entera... Gracias por acompañarnos en uno de ellos.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_MX">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <div class="shooting-star shooting-star-one" aria-hidden="true"></div>
  <div class="shooting-star shooting-star-two" aria-hidden="true"></div>

  <main class="hero" id="inicio">
    <div class="gold-dust gold-dust-one" aria-hidden="true"></div>
    <div class="gold-dust gold-dust-two" aria-hidden="true"></div>

    <section class="hero-content">
      <div class="crown-wrap reveal reveal-1" aria-hidden="true">
        <div class="crown-glow"></div>
        <div class="royal-crown">
          <span class="crown-tip t1">✦</span>
          <span class="crown-tip t2">◆</span>
          <span class="crown-tip t3">✦</span>
          <span class="crown-tip t4">◆</span>
          <span class="crown-tip t5">✦</span>
          <div class="crown-body">
            <span class="gem g1"></span><span class="gem g2"></span><span class="gem g3"></span>
          </div>
          <div class="crown-band"></div>
        </div>
      </div>

      <p class="pretitle reveal reveal-2">Una noche bajo las estrellas</p>

      <h1 class="name reveal reveal-3" aria-label="Analy">
        <span>A</span><span>N</span><span>A</span><span>L</span><span>Y</span>
      </h1>

      <p class="event-title reveal reveal-4">Mis XV Años</p>

      <div class="divider reveal reveal-4" aria-hidden="true">
        <span></span><i>✦</i><span></span>
      </div>

      <p class="date reveal reveal-5">12 · SEPTIEMBRE · 2026</p>
      <p class="place reveal reveal-5">San Luis Río Colorado, Sonora</p>

      <blockquote class="quote reveal reveal-6">
        “Hay momentos que iluminan una vida entera...<br>
        Gracias por acompañarnos en uno de ellos.”
      </blockquote>

      <button class="start-button reveal reveal-7" id="startButton" type="button">
        <span class="button-shine" aria-hidden="true"></span>
        <span>Comenzar la experiencia</span>
        <b aria-hidden="true">✦</b>
      </button>

      <p class="hint reveal reveal-7">Toca para descubrir la invitación</p>
    </section>

    <div class="scroll-mark" aria-hidden="true">
      <span></span>
    </div>
  </main>

  <section class="experience" id="experiencia" aria-hidden="true">
    <div class="cinema-scene">
      <div class="scene-stars" aria-hidden="true"></div>
      <p class="scene-intro">Y así comenzó su historia...</p>
      <figure class="baby-frame">
        <img src="analy-bebe-escena1.jpg" alt="Recuerdo de Analy recién nacida">
      </figure>
      <button class="continue-button" id="continueButton" type="button">
        Continuar <span aria-hidden="true">✦</span>
      </button>
      <button class="back-button scene-back" id="backButton" type="button">Volver</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
